<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ed Browser Automation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 16px;
      background: #f5f5f5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #ddd;
    }

    .status.connected {
      border-left-color: #22c55e;
      background: #f0fdf4;
    }

    .status.disconnected {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
    }

    .status.connected .status-dot {
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    .status.disconnected .status-dot {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      flex: 1;
      font-size: 13px;
    }

    .status.connected .status-text {
      color: #166534;
    }

    .status.disconnected .status-text {
      color: #991b1b;
    }

    .section {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5a67d8;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-item {
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #667eea;
    }

    .stat-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
    }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quick-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 12px;
      color: #374151;
      cursor: pointer;
      transition: all 0.15s;
    }

    .quick-btn:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .quick-btn svg {
      width: 16px;
      height: 16px;
      color: #667eea;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #999;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <h1>Ed Browser Automation</h1>
  </div>

  <div class="status disconnected" id="status">
    <div class="status-dot"></div>
    <div class="status-text" id="status-text">Disconnected</div>
  </div>

  <div class="section" id="connection-section">
    <div class="section-title">Connection</div>
    <div class="input-group">
      <input type="text" id="ws-url" value="ws://localhost:8080" placeholder="WebSocket URL">
    </div>
    <div class="input-group">
      <button class="btn-primary" id="connect-btn" style="flex: 1">Connect</button>
      <button class="btn-secondary" id="disconnect-btn" style="flex: 1">Disconnect</button>
    </div>
  </div>

  <div class="section" id="stats-section">
    <div class="section-title">Session</div>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="command-count">0</div>
        <div class="stat-label">Commands</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="last-command">-</div>
        <div class="stat-label">Last Action</div>
      </div>
    </div>
  </div>

  <div class="section" id="actions-section">
    <div class="section-title">Quick Actions</div>
    <div class="quick-actions">
      <button class="quick-btn" id="btn-read">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Read Page
      </button>
      <button class="quick-btn" id="btn-screenshot">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Screenshot
      </button>
    </div>
  </div>

  <div class="section" id="test-section">
    <div class="section-title">Test Field Interaction</div>
    <div class="input-group">
      <input type="text" id="test-selector" placeholder="CSS selector (e.g., #name)">
    </div>
    <div class="input-group">
      <input type="text" id="test-value" placeholder="Value to type">
    </div>
    <div class="input-group">
      <button class="btn-secondary btn-small" id="btn-click">Click</button>
      <button class="btn-secondary btn-small" id="btn-type">Type</button>
    </div>
  </div>

  <div class="footer">
    Schoolgle Ed Browser Extension v0.1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
