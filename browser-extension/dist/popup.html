<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 280px; padding: 16px; font-family: sans-serif; }
    .status { padding: 12px; background: #f0f0f0; border-radius: 8px; margin-bottom: 12px; }
    .status.connected { background: #e6fffa; border-left: 4px solid #22c55e; }
    .status.disconnected { background: #fef2f2; border-left: 4px solid #ef4444; }
    input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 10px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 4px; }
    button:hover { background: #5a67d8; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <h2>Ed Browser</h2>
  <div class="status disconnected" id="status">Disconnected</div>
  <input id="ws-url" value="ws://localhost:8080" placeholder="WebSocket URL">
  <button id="connect-btn">Connect</button>
  <button id="disconnect-btn" class="btn-secondary">Disconnect</button>
  <hr>
  <button id="read-btn">Read Page</button>
  <button id="screenshot-btn" class="btn-secondary">Screenshot</button>
  <script src="popup.js"></script>
</body>
</html>
