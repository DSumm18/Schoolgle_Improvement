<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .room-label { font-size: 9px; font-weight: 600; text-anchor: middle; fill: #333; }
    .room-sublabel { font-size: 7px; text-anchor: middle; fill: #666; }
    .floor-title { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .exit-label { font-size: 8px; font-weight: 600; fill: #D32F2F; }
    .corridor { fill: #EEEEEE; stroke: #BDBDBD; stroke-width: 0.5; }
  </style>
  <rect width="340" height="220" fill="white" rx="8"/>
  <text x="20" y="22" class="floor-title">Basement — Aurora Primary School</text>
  <rect x="20" y="150" width="300" height="50" class="corridor" rx="2"/>
  <rect x="20" y="50" width="100" height="100" fill="#FFCDD2" stroke="#D32F2F" stroke-width="1.5" rx="4" data-room-id="rm-boiler"/>
  <text x="70" y="94" class="room-label">Boiler</text>
  <text x="70" y="106" class="room-sublabel">Room</text>
  <rect x="120" y="50" width="100" height="100" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5" rx="4" data-room-id="rm-storage-b"/>
  <text x="170" y="100" class="room-label">Storage</text>
  <rect x="220" y="50" width="100" height="100" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5" rx="4" data-room-id="rm-caretaker"/>
  <text x="270" y="100" class="room-label">Caretaker</text>
</svg>