    .floor-title { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .exit-label { font-size: 8px; font-weight: 600; fill: #D32F2F; }
    .corridor { fill: #EEEEEE; stroke: #BDBDBD; stroke-width: 0.5; }
  </style>
  <rect width="640" height="470" fill="white" rx="8"/>
  <text x="20" y="22" class="floor-title">First Floor — Aurora Primary School</text>
  <rect x="20" y="350" width="275" height="50" class="corridor" rx="2"/>
  <rect x="345" y="400" width="275" height="50" class="corridor" rx="2"/>
  <rect x="20" y="50" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-ash"/>
  <text x="95" y="119" class="room-label">Ash</text>
  <text x="95" y="131" class="room-sublabel">(Year 2)</text>
  <rect x="170" y="50" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-willow"/>
