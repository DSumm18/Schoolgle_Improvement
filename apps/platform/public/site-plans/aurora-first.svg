  <text x="413.75" y="131" class="room-sublabel">(Year 4)</text>
  <rect x="482.5" y="50" width="137.5" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-pine"/>
  <text x="551.25" y="119" class="room-label">Pine</text>
  <text x="551.25" y="131" class="room-sublabel">(Year 4)</text>
  <rect x="345" y="200" width="137.5" height="100" fill="#E0F7FA" stroke="#00BCD4" stroke-width="1.5" rx="4" data-room-id="rm-library"/>
