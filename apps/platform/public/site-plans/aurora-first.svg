  <text x="245" y="281" class="room-sublabel">(Year 3)</text>
  <rect x="295" y="50" width="50" height="150" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5" rx="4" data-room-id="rm-toilet-ff"/>
