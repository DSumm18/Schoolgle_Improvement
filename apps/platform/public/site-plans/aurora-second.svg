<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .room-label { font-size: 9px; font-weight: 600; text-anchor: middle; fill: #333; }
    .room-sublabel { font-size: 7px; text-anchor: middle; fill: #666; }
    .floor-title { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .exit-label { font-size: 8px; font-weight: 600; fill: #D32F2F; }
    .corridor { fill: #EEEEEE; stroke: #BDBDBD; stroke-width: 0.5; }
  </style>
  <rect width="640" height="370" fill="white" rx="8"/>
  <text x="20" y="22" class="floor-title">Second Floor — Aurora Primary School</text>
  <rect x="20" y="200" width="600" height="50" class="corridor" rx="2"/>
  <rect x="20" y="50" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-beech"/>
  <text x="95" y="119" class="room-label">Beech</text>
  <text x="95" y="131" class="room-sublabel">(Year 5)</text>
  <rect x="170" y="50" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-chestnut"/>
  <text x="245" y="119" class="room-label">Chestnut</text>
  <text x="245" y="131" class="room-sublabel">(Year 5)</text>
  <rect x="320" y="50" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-hazel"/>
  <text x="395" y="119" class="room-label">Hazel</text>
  <text x="395" y="131" class="room-sublabel">(Year 6)</text>
  <rect x="470" y="50" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-sycamore"/>
  <text x="545" y="119" class="room-label">Sycamore</text>
  <text x="545" y="131" class="room-sublabel">(Year 6)</text>
  <rect x="20" y="250" width="150" height="100" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="4" data-room-id="rm-ppa"/>
  <text x="95" y="300" class="room-label">PPA Room</text>
  <rect x="170" y="250" width="150" height="100" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5" rx="4" data-room-id="rm-resources"/>
  <text x="245" y="300" class="room-label">Resources</text>
  <rect x="320" y="250" width="100" height="100" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5" rx="4" data-room-id="rm-toilet-sf"/>
  <text x="370" y="300" class="room-label">Toilets</text>
  <text x="-5" y="150" class="exit-label">🚪 ← West Stairs</text>
  <text x="645" y="150" class="exit-label">🚪 East Stairs →</text>
</svg>