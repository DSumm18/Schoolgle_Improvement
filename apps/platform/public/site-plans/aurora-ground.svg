  <text x="370" y="256" class="room-sublabel">Cloakroom</text>
  <rect x="320" y="300" width="100" height="100" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5" rx="4" data-room-id="rm-toilet-eyfs"/>
  <text x="370" y="344" class="room-label">EYFS</text>
  <text x="370" y="356" class="room-sublabel">Toilets</text>
  <rect x="420" y="200" width="200" height="200" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5" rx="4" data-room-id="rm-hall"/>
  <text x="520" y="300" class="room-label">Main Hall</text>
  <rect x="420" y="400" width="100" height="100" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5" rx="4" data-room-id="rm-kitchen"/>
  <text x="470" y="450" class="room-label">Kitchen</text>
  <rect x="520" y="400" width="100" height="100" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5" rx="4" data-room-id="rm-dining"/>
  <text x="570" y="450" class="room-label">Dining</text>
  <text x="20" y="25" class="exit-label">🚪 Main Entrance ↑</text>
  <text x="20" y="525" class="exit-label">🚪 EYFS Fire Door ↓</text>
  <text x="645" y="300" class="exit-label">🚪 Hall Fire Door →</text>
  <text x="420" y="525" class="exit-label">🚪 Kitchen Exit ↓</text>
</svg>