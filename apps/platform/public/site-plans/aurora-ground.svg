<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .room-label { font-size: 9px; font-weight: 600; text-anchor: middle; fill: #333; }
    .room-sublabel { font-size: 7px; text-anchor: middle; fill: #666; }
    .floor-title { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .exit-label { font-size: 8px; font-weight: 600; fill: #D32F2F; }
    .corridor { fill: #EEEEEE; stroke: #BDBDBD; stroke-width: 0.5; }
  </style>
  <rect width="640" height="520" fill="white" rx="8"/>
  <text x="20" y="22" class="floor-title">Ground Floor — Aurora Primary School</text>
  <rect x="20" y="150" width="600" height="50" class="corridor" rx="2"/>
  <rect x="20" y="50" width="100" height="100" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" rx="4" data-room-id="rm-reception"/>
  <text x="70" y="100" class="room-label">Reception</text>
  <rect x="120" y="50" width="100" height="100" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" rx="4" data-room-id="rm-head"/>
  <text x="170" y="94" class="room-label">Head's</text>
  <text x="170" y="106" class="room-sublabel">Office</text>
  <rect x="220" y="50" width="100" height="100" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5" rx="4" data-room-id="rm-admin"/>
  <text x="270" y="94" class="room-label">School</text>
  <text x="270" y="106" class="room-sublabel">Office</text>
  <rect x="320" y="50" width="100" height="100" fill="#E8EAF6" stroke="#3F51B5" stroke-width="1.5" rx="4" data-room-id="rm-meeting"/>
