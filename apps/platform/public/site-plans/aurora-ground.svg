  <rect x="520" y="50" width="100" height="100" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.5" rx="4" data-room-id="rm-send-1"/>
  <text x="570" y="94" class="room-label">Intervention</text>
  <text x="570" y="106" class="room-sublabel">Room 1</text>
  <rect x="20" y="200" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-oak"/>
  <text x="95" y="269" class="room-label">Oak</text>
  <text x="95" y="281" class="room-sublabel">(Reception)</text>
  <rect x="170" y="200" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-maple"/>
  <text x="245" y="269" class="room-label">Maple</text>
  <text x="245" y="281" class="room-sublabel">(Reception)</text>
  <rect x="20" y="350" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-birch"/>
  <text x="95" y="419" class="room-label">Birch</text>
  <text x="95" y="431" class="room-sublabel">(Year 1)</text>
  <rect x="170" y="350" width="150" height="150" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="4" data-room-id="rm-elm"/>
  <text x="245" y="419" class="room-label">Elm</text>
  <text x="245" y="431" class="room-sublabel">(Year 1)</text>
  <rect x="320" y="200" width="100" height="100" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5" rx="4" data-room-id="rm-cloakroom-eyfs"/>
